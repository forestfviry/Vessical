<svg viewBox="0 0 340 322" id="heart-svg" role="img" aria-label="Heart schematic with LCX, LAD and RCA arteries coloured by predicted stenosis risk">
  <defs>
    <!-- main body: light from top-left -->
    <radialGradient id="heartFill" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0%"  stop-color="#a8566e"/>
      <stop offset="35%" stop-color="#7a3a52"/>
      <stop offset="75%" stop-color="#3f2030"/>
      <stop offset="100%" stop-color="#1c0f19"/>
    </radialGradient>
    <!-- form shadow on the right + underside -->
    <linearGradient id="heartShade" x1="0.15" y1="0.1" x2="0.95" y2="0.95">
      <stop offset="0%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <!-- specular highlight -->
    <radialGradient id="heartSpec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- rim light on the lower right edge -->
    <radialGradient id="heartRim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="80%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff9ab8" stop-opacity="0.25"/>
    </radialGradient>
    <!-- atria + great vessels -->
    <radialGradient id="atriaFill" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#8a4660"/>
      <stop offset="100%" stop-color="#2a1521"/>
    </radialGradient>
    <linearGradient id="aortaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0697f"/>
      <stop offset="100%" stop-color="#4a2233"/>
    </linearGradient>
    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heartClip">
      <path d="M170 62 C 118 22, 42 66, 46 152 C 50 232, 118 284, 170 290 C 222 284, 290 232, 294 152 C 298 66, 222 22, 170 62 Z"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="176" cy="300" rx="104" ry="10" fill="url(#groundShadow)" pointer-events="none"/>

  <g id="heart-body" class="heart-body">
    <!-- atrial appendages (behind the ventricles) -->
    <ellipse cx="108" cy="82" rx="34" ry="22" transform="rotate(-28 108 82)" style="fill:url(#atriaFill)" pointer-events="none"/>
    <ellipse cx="236" cy="84" rx="36" ry="24" transform="rotate(24 236 84)" style="fill:url(#atriaFill)" pointer-events="none"/>

    <!-- aorta + pulmonary trunk as shaded tubes -->
    <path d="M168 64 C 166 36, 196 22, 214 34 C 232 46, 230 72, 216 84" style="fill:none;stroke:#1c0f19;stroke-width:20;stroke-linecap:round;opacity:.55" filter="url(#softShadow)" pointer-events="none"/>
    <path d="M168 64 C 166 36, 196 22, 214 34 C 232 46, 230 72, 216 84" style="fill:none;stroke:url(#aortaGrad);stroke-width:16;stroke-linecap:round" pointer-events="none"/>
    <path d="M166 62 C 164 40, 190 28, 208 36" style="fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:3;stroke-linecap:round" pointer-events="none"/>
    <path d="M150 66 C 132 44, 116 40, 104 50" style="fill:none;stroke:url(#aortaGrad);stroke-width:12;stroke-linecap:round" pointer-events="none"/>

    <!-- ventricular body -->
    <path class="heart-shape" d="M170 62 C 118 22, 42 66, 46 152 C 50 232, 118 284, 170 290 C 222 284, 290 232, 294 152 C 298 66, 222 22, 170 62 Z"
          style="fill:url(#heartFill);stroke:#2a1521;stroke-width:2"/>

    <g clip-path="url(#heartClip)" pointer-events="none">
      <!-- right-hand form shadow -->
      <rect x="40" y="20" width="260" height="280" fill="url(#heartShade)"/>
      <!-- right ventricle bulge (slightly darker, rounded) -->
      <path d="M176 76 C 240 70, 300 120, 286 196 C 272 250, 216 280, 172 288 C 200 240, 206 150, 176 76 Z" fill="#000" opacity="0.22"/>
      <!-- interventricular groove (the LAD runs along it) -->
      <path d="M170 72 C 158 112, 178 150, 164 194 C 156 226, 165 254, 162 280" fill="none" stroke="#150a12" stroke-width="10" opacity="0.45" filter="url(#softShadow)"/>
      <!-- apex darkening -->
      <ellipse cx="166" cy="292" rx="70" ry="30" fill="#000" opacity="0.35"/>
      <!-- rim light -->
      <ellipse cx="170" cy="160" rx="128" ry="130" fill="url(#heartRim)"/>
      <!-- specular highlights -->
      <ellipse cx="108" cy="110" rx="40" ry="20" transform="rotate(-38 108 110)" fill="url(#heartSpec)"/>
      <ellipse cx="86" cy="160" rx="10" ry="22" transform="rotate(-12 86 160)" fill="url(#heartSpec)" opacity=".6"/>
    </g>

    <!-- vessels: soft shadow under each, original path on top, thin highlight over -->
    <g class="vessel-shadow-group" pointer-events="none" filter="url(#softShadow)" style="fill:none;stroke:#000;stroke-opacity:.55;stroke-width:9;stroke-linecap:round" transform="translate(3 4)">
      <path d="M158 76 C 116 88, 82 118, 74 158 C 69 186, 80 208, 98 220"/>
      <path d="M168 72 C 156 112, 176 150, 162 194 C 154 224, 163 252, 160 274"/>
      <path d="M184 74 C 228 86, 258 116, 266 156 C 271 186, 258 212, 238 224"/>
    </g>

    <path id="vessel-LCX" class="vessel" d="M158 76 C 116 88, 82 118, 74 158 C 69 186, 80 208, 98 220"/>
    <path id="vessel-LAD" class="vessel" d="M168 72 C 156 112, 176 150, 162 194 C 154 224, 163 252, 160 274"/>
    <path id="vessel-RCA" class="vessel" d="M184 74 C 228 86, 258 116, 266 156 C 271 186, 258 212, 238 224"/>

    <g class="vessel-hl-group" pointer-events="none" transform="translate(-1.4 -1.6)" style="fill:none;stroke:#fff;stroke-opacity:.38;stroke-width:1.6;stroke-linecap:round">
      <path d="M158 76 C 116 88, 82 118, 74 158 C 69 186, 80 208, 98 220"/>
      <path d="M168 72 C 156 112, 176 150, 162 194 C 154 224, 163 252, 160 274"/>
      <path d="M184 74 C 228 86, 258 116, 266 156 C 271 186, 258 212, 238 224"/>
    </g>
  </g>

  <!-- labels (unchanged) -->
  <g class="vessel-label" data-vessel="LCX" tabindex="0" role="button" aria-label="Inspect LCX">
    <rect x="6" y="150" width="52" height="24" rx="12"/>
    <text x="32" y="166" text-anchor="middle">LCX</text>
  </g>
  <g class="vessel-label" data-vessel="LAD" tabindex="0" role="button" aria-label="Inspect LAD">
    <rect x="144" y="288" width="52" height="24" rx="12"/>
    <text x="170" y="304" text-anchor="middle">LAD</text>
  </g>
  <g class="vessel-label" data-vessel="RCA" tabindex="0" role="button" aria-label="Inspect RCA">
    <rect x="282" y="150" width="52" height="24" rx="12"/>
    <text x="308" y="166" text-anchor="middle">RCA</text>
  </g>
</svg>
